<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070a10">
  <meta name="description" content="Comunicación Criptográfica Multicapa Cero Rastro">
  <title>CIPHER // Red Segura en Tiempo Real</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg-main: #070a10;
      --bg-panel: #0d131f;
      --cyan: #00f3ff;
      --emerald: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand svg { width: 28px; height: 28px; }
    .brand h1 { font-size: 1.2rem; letter-spacing: 2px; color: var(--cyan); }

    .status-badge {
      font-size: 0.65rem;
      padding: 4px 8px;
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.1);
      font-weight: bold;
    }
    .status-badge.connecting {
      border-color: var(--warning);
      color: var(--warning);
      background: rgba(245, 158, 11, 0.1);
    }
    .status-badge.connected {
      border-color: var(--emerald);
      color: var(--emerald);
      background: rgba(16, 185, 129, 0.1);
    }

    .config-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
    }

    .config-panel label {
      font-size: 0.7rem;
      color: var(--cyan);
      display: block;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .config-panel input {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
    }
    .config-panel input:focus { border-color: var(--cyan); }

    .chat-container {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      word-break: break-word;
      line-height: 1.3;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.sent {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      align-self: flex-end;
    }

    .message.received {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      align-self: flex-start;
    }

    .message.system {
      background: transparent;
      color: var(--text-muted);
      text-align: center;
      align-self: center;
      font-size: 0.75rem;
      border: none;
    }

    .chat-input-area {
      display: flex;
      flex-direction: column;
      padding: 8px;
      background: var(--bg-main);
      border-top: 1px solid var(--border);
      gap: 6px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
    }

    .chat-input-area textarea {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      resize: none;
      height: 45px;
      outline: none;
    }
    .chat-input-area textarea:focus { border-color: var(--cyan); }

    .btn-send {
      background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
      color: #070a10;
      border: none;
      padding: 0 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    .btn-send:active { opacity: 0.8; }

    .footer-actions {
      display: flex;
      gap: 8px;
    }

    .btn-wipe {
      flex: 1;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 8px;
      font-weight: bold;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--emerald);
      color: var(--bg-main);
      padding: 6px 14px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 0.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 1000;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg viewBox="0 0 512 512">
        <path d="M256 64L96 136v112c0 104.5 68.3 202.2 160 228 91.7-25.8 160-123.5 160-228V136L256 64z" fill="none" stroke="#00f3ff" stroke-width="32"/>
        <circle cx="256" cy="240" r="32" fill="#10b981"/>
        <path d="M256 272v56" stroke="#10b981" stroke-width="28" stroke-linecap="round"/>
      </svg>
      <h1>CIPHER</h1>
    </div>
    <span class="status-badge connecting" id="netStatus">CONECTANDO...</span>
  </header>

  <div class="config-panel">
    <label for="secretKey">LLAVE MAESTRA COMPARTIDA (SESIÓN)</label>
    <input type="password" id="secretKey" placeholder="Introduce la clave secreta compartida..." autocomplete="off">
  </div>

  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="message system">Canal seguro inicializado. Esperando conexión al nodo...</div>
    </div>
    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea id="messageInput" placeholder="Escribe tu mensaje confidencial..." rows="1" onkeydown="handleKey(event)"></textarea>
        <button class="btn-send" onclick="sendMessage()">CIFRAR Y ENVIAR</button>
      </div>
    </div>
  </div>

  <div class="footer-actions">
    <button class="btn-wipe" onclick="purgeMemory()">PURGA CERO RASTRO</button>
  </div>

  <div class="toast" id="toast">Acción completada</div>

  <script>
    const WS_URL = 'wss://app-cipher.onrender.com'; 
    let socket;
    let reconnectAttempts = 0;

    function initWebSocket() {
      const badge = document.getElementById('netStatus');
      badge.textContent = reconnectAttempts === 0 ? 'CONECTANDO...' : 'RECONECTANDO...';
      badge.className = 'status-badge connecting';

      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        reconnectAttempts = 0;
        badge.textContent = 'EN LÍNEA (AES)';
        badge.className = 'status-badge connected';
        showToast('Conectado al servidor seguro');
      };

      socket.onclose = () => {
        badge.textContent = 'DESPERTANDO SERVIDOR...';
        badge.className = 'status-badge connecting';
        reconnectAttempts++;
        setTimeout(initWebSocket, 4000);
      };

      socket.onerror = (err) => {
        console.error('Error de red WS:', err);
      };

      socket.onmessage = async (event) => {
        try {
          const cipherText = event.data;
          const decrypted = await decryptMessage(cipherText);
          appendMessage(decrypted, 'received');
        } catch (e) {
          appendMessage('[Bloque recibido con llave distinta o corrupto]', 'system');
        }
      };
    }

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptMessage(text, password) {
      const enc = new TextEncoder();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(text));

      const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(encrypted), salt.length + iv.length);
      return btoa(String.fromCharCode(...combined));
    }

    async function decryptMessage(base64Data) {
      const password = document.getElementById('secretKey').value;
      if (!password) throw new Error('Sin llave');

      const combined = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
      const salt = combined.slice(0, 16);
      const iv = combined.slice(16, 28);
      const data = combined.slice(28);

      const key = await deriveKey(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
      return new TextDecoder().decode(decrypted);
    }

    async function sendMessage() {
      const password = document.getElementById('secretKey').value;
      const input = document.getElementById('messageInput');
      const text = input.value.trim();

      if (!password) {
        showToast('Ingresa la llave maestra primero', true);
        return;
      }
      if (!text) return;

      if (!socket || socket.readyState !== WebSocket.OPEN) {
        showToast('Servidor despertando, espera un momento...', true);
        return;
      }

      try {
        const encryptedBase64 = await encryptMessage(text, password);
        socket.send(encryptedBase64);
        appendMessage(text, 'sent');
        input.value = '';
      } catch (e) {
        showToast('Error al cifrar el mensaje', true);
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function appendMessage(text, type) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function purgeMemory() {
      document.getElementById('secretKey').value = '';
      document.getElementById('messageInput').value = '';
      document.getElementById('chatMessages').innerHTML = '<div class="message system">Memoria purgada. Cero rastros en RAM.</div>';
      showToast('Memoria purgada');
    }

    initWebSocket();
  </script>
</body>
</html>
