<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070a10">
  <title>CIPHER // Debug Mode</title>
  <style>
    :root {
      --bg-main: #070a10;
      --bg-panel: #0d131f;
      --cyan: #00f3ff;
      --emerald: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #e2e8f0;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; padding: 10px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
    h1 { font-size: 1rem; color: var(--cyan); }
    .badge { font-size: 0.6rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
    .badge.ok { background: rgba(16, 185, 129, 0.1); color: var(--emerald); border-color: var(--emerald); }
    .badge.warn { background: rgba(245, 158, 11, 0.1); color: var(--warning); border-color: var(--warning); }
    
    .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 6px; }
    input { width: 100%; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 4px; font-size: 0.8rem; outline: none; }
    
    /* Consola de depuración en pantalla */
    .debug-box {
      flex: 1;
      background: #020408;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-size: 0.7rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--warning);
    }
    .debug-line { border-bottom: 1px solid #111; padding-bottom: 2px; }
    .debug-line.error { color: var(--danger); }
    .debug-line.success { color: var(--emerald); }
  </style>
</head>
<body>

  <header>
    <h1>CIPHER // DIAGNÓSTICO</h1>
    <span class="badge warn" id="statusBadge">INICIANDO...</span>
  </header>

  <div class="panel">
    <label style="font-size:0.65rem; color:var(--cyan); display:block; margin-bottom:4px;">LLAVE MAESTRA</label>
    <input type="password" id="secretKey" placeholder="Introduce clave...">
  </div>

  <div class="debug-box" id="debugConsole">
    <div class="debug-line">[SYS] Iniciando motor de red...</div>
  </div>

  <script>
    const WS_URL = 'wss://app-cipher.onrender.com';
    const badge = document.getElementById('statusBadge');
    const consoleBox = document.getElementById('debugConsole');

    function logDebug(text, type = '') {
      const div = document.createElement('div');
      div.className = `debug-line ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      consoleBox.appendChild(div);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    logDebug(`Intentando conectar a: ${WS_URL}`);

    let socket;
    try {
      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        badge.textContent = 'CONECTADO';
        badge.className = 'badge ok';
        logDebug('¡Conexión WebSocket establecida con éxito!', 'success');
      };

      socket.onclose = (event) => {
        badge.textContent = 'DESCONECTADO';
        badge.className = 'badge';
        logDebug(`Conexión cerrada. Código: ${event.code}, Motivo: "${event.reason || 'Desconocido'}"`, 'error');
      };

      socket.onerror = (error) => {
        badge.textContent = 'ERROR DE RED';
        badge.className = 'badge';
        logDebug(`Error crítico en WebSocket (CORS, dominio o SSL inválido)`, 'error');
        console.error('WS Error:', error);
      };

      socket.onmessage = (event) => {
        logDebug(`Mensaje recibido del servidor: ${event.data.substring(0, 30)}...`, 'success');
      };

    } catch (e) {
      logDebug(`Excepción al crear WebSocket: ${e.message}`, 'error');
    }
  </script>
</body>
</html>
