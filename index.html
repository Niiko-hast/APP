<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070a10">
  <meta name="description" content="Comunicación Criptográfica Multicapa Cero Rastro">
  <title>CIPHER // Quantum Fortified</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg-main: #070a10;
      --bg-panel: #0d131f;
      --cyan: #00f3ff;
      --emerald: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px;
      overflow: hidden;
      /* Capa de protección visual contra grabación rápida */
      -webkit-touch-callout: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand svg { width: 24px; height: 24px; }
    .brand h1 { font-size: 1.1rem; letter-spacing: 2px; color: var(--cyan); }

    .status-badge {
      font-size: 0.6rem;
      padding: 3px 6px;
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.1);
      font-weight: bold;
    }
    .status-badge.connecting { border-color: var(--warning); color: var(--warning); background: rgba(245, 158, 11, 0.1); }
    .status-badge.connected { border-color: var(--emerald); color: var(--emerald); background: rgba(16, 185, 129, 0.1); }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      display: none;
    }
    .view-screen.active { display: flex; }

    .auth-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .auth-container h2 { color: var(--cyan); font-size: 1.1rem; margin-bottom: 10px; }
    .auth-container p { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4; }
    .auth-container input {
      width: 100%;
      max-width: 280px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
      text-align: center;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .auth-container input:focus { border-color: var(--cyan); }
    .btn-auth {
      background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
      color: #070a10;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    .home-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .home-header span { font-size: 0.75rem; color: var(--cyan); }
    .btn-new-chat {
      background: var(--bg-panel);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      font-weight: bold;
    }
    .chat-list {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-item {
      background: var(--bg-main);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-item-info { flex: 1; cursor: pointer; }
    .chat-item-info h4 { font-size: 0.85rem; color: var(--cyan); display: flex; justify-content: space-between; align-items: center; }
    .chat-item-info p { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
    
    .unread-badge {
      background: var(--cyan);
      color: var(--bg-main);
      font-size: 0.6rem;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    .btn-delete-chat {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      cursor: pointer;
    }

    .chat-container {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-bottom: 6px;
      min-height: 0;
      position: relative;
    }

    .chat-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
    }
    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .request-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 10, 16, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 500;
      display: none;
      text-align: center;
    }
    .request-modal h3 { color: var(--cyan); font-size: 1rem; margin-bottom: 10px; }
    .request-modal p { font-size: 0.75rem; color: var(--text-main); margin-bottom: 15px; }
    .modal-actions { display: flex; gap: 10px; width: 100%; max-width: 250px; }
    .btn-accept { flex: 1; background: var(--emerald); color: var(--bg-main); border: none; padding: 8px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .btn-reject { flex: 1; background: var(--danger); color: var(--text-main); border: none; padding: 8px; font-weight: bold; border-radius: 4px; cursor: pointer; }

    .chat-messages {
      flex: 1;
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message {
      max-width: 88%;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      word-break: break-word;
      line-height: 1.3;
      position: relative;
    }
    .message.sent { background: rgba(0, 243, 255, 0.08); border: 1px solid var(--cyan); color: var(--cyan); align-self: flex-end; }
    .message.received { background: rgba(16, 185, 129, 0.08); border: 1px solid var(--emerald); color: var(--emerald); align-self: flex-start; }
    .message.system { background: transparent; color: var(--text-muted); text-align: center; align-self: center; font-size: 0.7rem; border: none; }

    .msg-meta { font-size: 0.55rem; display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; color: var(--text-muted); }
    .msg-media img, .msg-media video { max-width: 100%; border-radius: 4px; margin-top: 4px; }

    .chat-input-area { display: flex; flex-direction: column; padding: 6px; background: var(--bg-main); border-top: 1px solid var(--border); gap: 6px; width: 100%; }
    .chat-input-row { display: flex; gap: 6px; align-items: center; width: 100%; }
    .chat-input-area textarea {
      flex: 1; min-width: 0; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main);
      padding: 6px; border-radius: 4px; font-size: 0.8rem; resize: none; height: 38px; outline: none;
    }
    .chat-input-area textarea:focus { border-color: var(--cyan); }

    .btn-action { background: var(--bg-panel); border: 1px solid var(--border); color: var(--cyan); padding: 0 10px; height: 38px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: bold; flex-shrink: 0; }
    .btn-send { background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%); color: #070a10; border: none; padding: 0 12px; height: 38px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.75rem; letter-spacing: 1px; flex-shrink: 0; }

    .footer-actions { display: flex; gap: 6px; margin-top: 6px; }
    .btn-wipe { flex: 1; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 6px; font-weight: bold; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }

    .toast { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: var(--emerald); color: var(--bg-main); padding: 5px 12px; border-radius: 12px; font-weight: bold; font-size: 0.7rem; opacity: 0.9; pointer-events: none; z-index: 1000; display: none; }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="brand">
      <svg viewBox="0 0 512 512">
        <path d="M256 64L96 136v112c0 104.5 68.3 202.2 160 228 91.7-25.8 160-123.5 160-228V136L256 64z" fill="none" stroke="#00f3ff" stroke-width="32"/>
        <circle cx="256" cy="240" r="32" fill="#10b981"/>
        <path d="M256 272v56" stroke="#10b981" stroke-width="28" stroke-linecap="round"/>
      </svg>
      <h1>CIPHER SHIELD</h1>
    </div>
    <span class="status-badge connecting" id="netStatus">CONECTANDO...</span>
  </header>

  <div id="authView" class="view-screen active">
    <div class="auth-container">
      <h2 id="authTitle">ACCESO BLINDADO</h2>
      <p id="authDesc">Introduce tu Clave Maestra personal y tu Código Único.</p>
      <input type="password" id="masterKeyInput" placeholder="Clave Maestra..." autocomplete="off">
      <input type="text" id="customCodeInput" maxlength="6" placeholder="Tu Código Fijo (Ej. OMAR)..." autocomplete="off" style="display:none;">
      <button class="btn-auth" onclick="triggerAuth()">ACCEDER</button>
    </div>
  </div>

  <div id="homeView" class="view-screen">
    <div class="home-header">
      <span>MI CÓDIGO: <strong id="displayMyCode" style="color:var(--emerald);">...</strong></span>
      <button class="btn-new-chat" onclick="openNewChatPrompt()">+ Nuevo Chat</button>
    </div>
    <div class="chat-list" id="chatList">
      <div style="text-align:center; color:var(--text-muted); font-size:0.7rem; margin-top:20px;">No hay chats activos. Pulsa "+ Nuevo Chat".</div>
    </div>
  </div>

  <div id="chatView" class="view-screen">
    <div class="chat-container">
      <div class="request-modal" id="requestModal">
        <h3>SOLICITUD DE CHAT ENTRANTE</h3>
        <p id="requestText">Un nodo quiere iniciar comunicación contigo.</p>
        <div class="modal-actions">
          <button class="btn-reject" onclick="respondRequest(false)">RECHAZAR</button>
          <button class="btn-accept" onclick="respondRequest(true)">ACEPTAR</button>
        </div>
      </div>

      <div class="chat-top-bar">
        <button class="btn-back" onclick="goToHome()">❮ Volver</button>
        <span id="activeChatTitle" style="color:var(--cyan); font-weight:bold;">CHAT</span>
        <select id="destructTimer" style="background:var(--bg-main); border:1px solid var(--border); color:var(--cyan); font-size:0.65rem; padding:2px; border-radius:3px;">
          <option value="0">⏳ Fijo</option>
          <option value="10">🔥 10s</option>
          <option value="30">🔥 30s</option>
          <option value="60">🔥 60s</option>
        </select>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="message system">Canal seguro cifrado.</div>
      </div>

      <div class="chat-input-area">
        <div class="chat-input-row">
          <input type="file" id="mediaInput" style="display:none" accept="image/*,video/*,audio/*" onchange="handleMedia(this)">
          <button class="btn-action" onclick="document.getElementById('mediaInput').click()">📁</button>
          <textarea id="messageInput" placeholder="Mensaje cifrado..." rows="1" onkeydown="handleKey(event)"></textarea>
          <button class="btn-send" onclick="sendMessage('text')">CIFRAR</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-actions">
    <button class="btn-wipe" onclick="triggerKillSwitch()">PURGA TOTAL (KILL-SWITCH)</button>
  </div>

  <div class="toast" id="toast">Acción completada</div>

  <script>
    const WS_URL = 'wss://app-cipher.onrender.com'; 
    let socket;
    let masterKey = '';
    let myCode = '';
    let currentTarget = '';
    let chatsData = {}; 
    let approvedChats = new Set();
    let pendingRequester = null;
    let audioCtx = null;

    window.addEventListener('DOMContentLoaded', () => {
      const saltStored = localStorage.getItem('cipher_auth_salt');
      if (!saltStored) {
        document.getElementById('authTitle').textContent = "CREAR PERFIL SEGURO";
        document.getElementById('authDesc').textContent = "Crea tu Clave Maestra y define tu Código Fijo de usuario (4-6 caracteres).";
        document.getElementById('customCodeInput').style.display = 'block';
      } else {
        myCode = localStorage.getItem('cipher_my_code') || '';
      }
      
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    });

    // Protección anti-captura / grabación (Desenfoque automático y ocultación si cambia la visibilidad)
    window.addEventListener('blur', () => { 
      document.body.style.filter = 'blur(15px)';
      document.body.style.opacity = '0.1';
    });
    window.addEventListener('focus', () => { 
      document.body.style.filter = 'none';
      document.body.style.opacity = '1';
    });

    function triggerAuth() {
      setTimeout(handleMasterKey, 10);
    }

    async function handleMasterKey() {
      const keyVal = document.getElementById('masterKeyInput').value.trim();
      const codeVal = document.getElementById('customCodeInput').value.trim().toUpperCase();

      if (!keyVal) {
        showToast('Introduce tu Clave Maestra');
        return;
      }

      const saltStored = localStorage.getItem('cipher_auth_salt');
      const verifStored = localStorage.getItem('cipher_auth_verifier');

      try {
        if (!saltStored || !verifStored) {
          if (!codeVal || codeVal.length < 3) {
            showToast('Define un Código Fijo válido (mín. 3 caracteres)');
            return;
          }

          myCode = codeVal;
          localStorage.setItem('cipher_my_code', myCode);

          const salt = crypto.getRandomValues(new Uint8Array(16));
          const verifIv = crypto.getRandomValues(new Uint8Array(12));
          const key = await deriveKey(keyVal, salt);
          
          const encryptedVerif = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: verifIv }, key, new TextEncoder().encode("CIPHER_VALID"));
          
          localStorage.setItem('cipher_auth_salt', btoa(String.fromCharCode(...salt)));
          localStorage.setItem('cipher_auth_verifier', btoa(String.fromCharCode(...verifIv)) + ":" + btoa(String.fromCharCode(...new Uint8Array(encryptedVerif))));
          
          masterKey = keyVal;
          document.getElementById('masterKeyInput').value = '';
          document.getElementById('customCodeInput').value = '';
          await loadLocalChats(keyVal);
          startAppSession();
          showToast('¡Perfil y Clave Maestra creados!');
        } else {
          const salt = Uint8Array.from(atob(saltStored), c => c.charCodeAt(0));
          const [ivB64, dataB64] = verifStored.split(":");
          const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
          const data = Uint8Array.from(atob(dataB64), c => c.charCodeAt(0));

          const key = await deriveKey(keyVal, salt);
          const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
          const decryptedStr = new TextDecoder().decode(decrypted);

          if (decryptedStr === "CIPHER_VALID") {
            masterKey = keyVal;
            document.getElementById('masterKeyInput').value = '';
            myCode = localStorage.getItem('cipher_my_code');
            await loadLocalChats(keyVal);
            startAppSession();
            showToast('Sesión desbloqueada');
          } else {
            throw new Error("Clave incorrecta");
          }
        }
      } catch (e) {
        showToast('❌ Clave Maestra Incorrecta o Error Crypto');
        document.getElementById('masterKeyInput').value = '';
      }
    }

    function startAppSession() {
      document.getElementById('displayMyCode').textContent = myCode;
      document.getElementById('authView').classList.remove('active');
      document.getElementById('homeView').classList.add('active');
      initWebSocket();
    }

    async function loadLocalChats(password) {
      try {
        const encryptedBlob = localStorage.getItem('cipher_secure_vault_' + myCode);
        if (!encryptedBlob) {
          chatsData = {};
          approvedChats = new Set();
          return;
        }

        const combined = Uint8Array.from(atob(encryptedBlob), c => c.charCodeAt(0));
        const salt = combined.slice(0, 16);
        const iv = combined.slice(16, 28);
        const data = combined.slice(28);

        const key = await deriveKey(password, salt);
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
        const parsed = JSON.parse(new TextDecoder().decode(decrypted));

        chatsData = parsed.chats || {};
        approvedChats = new Set(parsed.approved || []);
      } catch (e) {
        chatsData = {};
        approvedChats = new Set();
      }
      renderChatList();
    }

    async function saveLocalChats() {
      if (!masterKey) return;
      try {
        const payload = JSON.stringify({ chats: chatsData, approved: [...approvedChats] });
        const enc = new TextEncoder();
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(masterKey, salt);
        const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(payload));

        const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
        combined.set(salt, 0);
        combined.set(iv, salt.length);
        combined.set(new Uint8Array(encrypted), salt.length + iv.length);

        localStorage.setItem('cipher_secure_vault_' + myCode, btoa(String.fromCharCode(...combined)));
      } catch (e) {
        console.error("Error guardando bóveda");
      }
    }

    async function getUniversalChannelSecret(partnerCode) {
      const sorted = [myCode, partnerCode].sort().join('_');
      return "CIPHER_SECURE_CHANNEL_" + sorted;
    }

    function initWebSocket() {
      const badge = document.getElementById('netStatus');
      badge.textContent = 'CONECTANDO...';
      badge.className = 'status-badge connecting';

      try {
        socket = new WebSocket(WS_URL);

        socket.onopen = () => {
          badge.textContent = 'EN LÍNEA (AES)';
          badge.className = 'status-badge connected';
          if (myCode) {
            socket.send(JSON.stringify({ type: 'register', code: myCode }));
          }
        };

        socket.onclose = () => {
          badge.textContent = 'RECONECTANDO...';
          badge.className = 'status-badge connecting';
          // Reconexión agresiva instantánea para recuperar mensajes en segundo plano
          setTimeout(initWebSocket, 1500);
        };

        socket.onmessage = async (event) => {
          try {
            const rawPacket = JSON.parse(event.data);

            if (rawPacket.type === 'chat_request' && rawPacket.to === myCode) {
              pendingRequester = rawPacket.from;
              ensureChatExists(pendingRequester);
              document.getElementById('requestText').textContent = `El nodo [${pendingRequester}] quiere iniciar un canal seguro contigo.`;
              document.getElementById('requestModal').style.display = 'flex';
              playNotificationSound();
              return;
            }

            if (rawPacket.type === 'chat_response' && rawPacket.to === myCode) {
              if (rawPacket.accepted) {
                approvedChats.add(rawPacket.from);
                ensureChatExists(rawPacket.from);
                chatsData[rawPacket.from].approved = true;
                saveLocalChats();
                renderChatList();
                showToast(`¡Chat aceptado por [${rawPacket.from}]!`);
                if (currentTarget === rawPacket.from) {
                  updateMessageStatus('pending_req_' + rawPacket.from, '✓ CANAL ABIERTO');
                }
              } else {
                showToast(`[${rawPacket.from}] rechazó el chat`);
              }
              return;
            }

            if (rawPacket.type === 'ack' && rawPacket.target === myCode) {
              updateMessageStatus(rawPacket.msgId, rawPacket.status);
              return;
            }

            if (rawPacket.type === 'msg' && rawPacket.to === myCode) {
              if (!approvedChats.has(rawPacket.from)) {
                pendingRequester = rawPacket.from;
                document.getElementById('requestText').textContent = `El nodo [${pendingRequester}] te envió un mensaje pero requiere aprobación.`;
                document.getElementById('requestModal').style.display = 'flex';
                playNotificationSound();
                return;
              }

              const channelSecret = await getUniversalChannelSecret(rawPacket.from);
              const decrypted = await decryptPayload(rawPacket.payload, channelSecret);
              
              ensureChatExists(rawPacket.from);
              chatsData[rawPacket.from].approved = true;

              sendAck(decrypted.id, '✓✓ ENTREGADO', rawPacket.from);

              chatsData[rawPacket.from].messages.push({
                data: decrypted,
                type: 'received',
                timer: decrypted.timer,
                msgId: decrypted.id,
                sender: rawPacket.from,
                status: '●● LEÍDO',
                time: decrypted.time
              });

              // Sonido y notificación ciega obligatoria al recibir
              playNotificationSound();
              triggerNotification(rawPacket.from);

              if (currentTarget !== rawPacket.from) {
                chatsData[rawPacket.from].unread = (chatsData[rawPacket.from].unread || 0) + 1;
              }

              saveLocalChats();

              if (currentTarget === rawPacket.from) {
                appendMessageToDOM(decrypted, 'received', decrypted.timer, decrypted.id, rawPacket.from, '●● LEÍDO', decrypted.time);
                setTimeout(() => sendAck(decrypted.id, '●● LEÍDO', rawPacket.from), 1000);
              }

              renderChatList();
            }
          } catch (e) {
            console.error("Error procesando paquete entrante:", e);
          }
        };
      } catch (e) {
        console.error("Excepción socket:", e);
      }
    }

    // Generador sintético de sonido de notificación seguro (Web Audio API)
    function playNotificationSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Tono A5 agudo seguro
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.log("Audio omitido por política del navegador");
      }
    }

    // Notificación flotante ciega (No muestra contenido por privacidad)
    function triggerNotification(senderCode) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(`CIPHER // Nuevo Mensaje`, {
          body: `Mensaje cifrado recibido de [${senderCode}]`,
          icon: './manifest.json'
        });
      }
      showToast(`Nuevo mensaje de [${senderCode}]`);
    }

    function ensureChatExists(code) {
      if (!chatsData[code]) {
        chatsData[code] = { messages: [], approved: approvedChats.has(code), unread: 0 };
      }
      if (chatsData[code].unread === undefined) {
        chatsData[code].unread = 0;
      }
    }

    function openNewChatPrompt() {
      const code = prompt("Introduce el Código Fijo del usuario al que deseas contactar:");
      if (!code) return;
      const target = code.trim().toUpperCase();
      if (target === myCode) {
        showToast("No puedes chatear contigo mismo");
        return;
      }
      openChat(target);
    }

    function openChat(code) {
      currentTarget = code;
      ensureChatExists(code);
      
      chatsData[code].unread = 0;
      saveLocalChats();

      document.getElementById('activeChatTitle').textContent = `CHAT: ${code}`;
      document.getElementById('homeView').classList.remove('active');
      document.getElementById('chatView').classList.add('active');

      const container = document.getElementById('chatMessages');
      container.innerHTML = '<div class="message system">Historial seguro cargado.</div>';
      
      chatsData[code].messages.forEach(msg => {
        appendMessageToDOM(msg.data, msg.type, msg.timer, msg.msgId, msg.sender, msg.status, msg.time);
      });
      renderChatList();
    }

    function goToHome() {
      currentTarget = '';
      document.getElementById('chatView').classList.remove('active');
      document.getElementById('homeView').classList.add('active');
      renderChatList();
    }

    function renderChatList() {
      const listEl = document.getElementById('chatList');
      const codes = Object.keys(chatsData);
      if (codes.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.7rem; margin-top:20px;">No hay chats activos.</div>';
        return;
      }

      let html = '';
      codes.forEach(code => {
        const chat = chatsData[code];
        const msgs = chat.messages;
        const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1].data.content : 'Canal establecido';
        const preview = typeof lastMsg === 'string' ? (lastMsg.substring(0, 22) + '...') : '[Archivo Multimedia]';
        const unreadBadge = chat.unread > 0 ? `<span class="unread-badge">${chat.unread}</span>` : '';
        
        html += `
          <div class="chat-item">
            <div class="chat-item-info" onclick="openChat('${code}')">
              <h4>[${code}] ${unreadBadge}</h4>
              <p>${preview}</p>
            </div>
            <button class="btn-delete-chat" onclick="deleteChat('${code}')">Borrar</button>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    function deleteChat(code) {
      if (confirm(`¿Estás seguro de borrar el chat con [${code}]?`)) {
        delete chatsData[code];
        approvedChats.delete(code);
        saveLocalChats();
        renderChatList();
        showToast('Chat eliminado');
      }
    }

    function respondRequest(accepted) {
      document.getElementById('requestModal').style.display = 'none';
      if (!socket || socket.readyState !== WebSocket.OPEN) return;

      if (accepted) {
        approvedChats.add(pendingRequester);
        ensureChatExists(pendingRequester);
        chatsData[pendingRequester].approved = true;
        saveLocalChats();
        showToast(`Canal abierto con [${pendingRequester}]`);
        renderChatList();
      }

      socket.send(JSON.stringify({
        type: 'chat_response',
        from: myCode,
        to: pendingRequester,
        accepted: accepted
      }));
      pendingRequester = null;
    }

    function sendAck(msgId, statusText, targetCode) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: 'ack', msgId: msgId, status: statusText, target: targetCode }));
    }

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptPayload(dataObj, password) {
      const enc = new TextEncoder();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(JSON.stringify(dataObj)));

      const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(encrypted), salt.length + iv.length);
      return btoa(String.fromCharCode(...combined));
    }

    async function decryptPayload(base64Data, password) {
      const combined = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
      const salt = combined.slice(0, 16);
      const iv = combined.slice(16, 28);
      const data = combined.slice(28);

      const key = await deriveKey(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    async function sendMessage(type, contentOverride = null) {
      if (!masterKey) {
        showToast('Clave maestra requerida');
        return;
      }
      const input = document.getElementById('messageInput');
      const text = contentOverride || input.value.trim();
      const timer = parseInt(document.getElementById('destructTimer').value);
      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (!text && type === 'text') return;
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        showToast('Red desconectada');
        return;
      }

      ensureChatExists(currentTarget);
      const msgId = 'msg_' + Math.random().toString(36).substring(2, 9);
      const dataObj = { id: msgId, from: myCode, type: type, content: text, timer: timer, time: timeString };

      if (!approvedChats.has(currentTarget)) {
        const reqId = 'pending_req_' + currentTarget;
        chatsData[currentTarget].messages.push({ data: dataObj, type: 'sent', timer, msgId: reqId, status: '⏳ SOLICITUD PENDIENTE', time: timeString });
        saveLocalChats();
        appendMessageToDOM(dataObj, 'sent', timer, reqId, myCode, '⏳ SOLICITUD PENDIENTE', timeString);

        socket.send(JSON.stringify({ type: 'chat_request', from: myCode, to: currentTarget }));
        showToast('Solicitud de chat enviada');
        if (!contentOverride) input.value = '';
        renderChatList();
        return;
      }

      chatsData[currentTarget].messages.push({ data: dataObj, type: 'sent', timer, msgId, status: '⏳ EN ESPERA', time: timeString });
      saveLocalChats();
      appendMessageToDOM(dataObj, 'sent', timer, msgId, myCode, '⏳ EN ESPERA', timeString);

      try {
        const channelSecret = await getUniversalChannelSecret(currentTarget);
        const encryptedBase64 = await encryptPayload(dataObj, channelSecret);
        
        socket.send(JSON.stringify({ type: 'msg', from: myCode, to: currentTarget, payload: encryptedBase64 }));
        updateMessageStatus(msgId, '✓ ENVIADO');
        if (!contentOverride) input.value = '';
        saveLocalChats();
        renderChatList();
      } catch (e) {
        showToast('Error de cifrado');
        updateMessageStatus(msgId, '❌ ERROR');
      }
    }

    function handleMedia(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        if (file.type.startsWith('image')) {
          const img = new Image();
          img.src = e.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500; const MAX_HEIGHT = 500;
            let width = img.width; let height = img.height;
            if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
            else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            sendMessage('image', canvas.toDataURL('image/jpeg', 0.5));
          };
        } else {
          sendMessage(file.type.startsWith('video') ? 'video' : 'audio', e.target.result);
        }
      };
      reader.readAsDataURL(file);
    }

    function appendMessageToDOM(data, type, timer, msgId, senderCode, initialStatus = '✓ ENVIADO', msgTime = '') {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `message ${type}`;
      if (msgId) div.id = msgId;

      let innerHTML = '';
      if (data.type === 'text') {
        innerHTML += `<span>${escapeHTML(data.content)}</span>`;
      } else if (data.type === 'image') {
        innerHTML += `<div class="msg-media"><img src="${data.content}"/></div>`;
      } else if (data.type === 'video') {
        innerHTML += `<div class="msg-media"><video controls src="${data.content}"></video></div>`;
      } else if (data.type === 'audio') {
        innerHTML += `<div class="msg-media"><audio controls src="${data.content}"></audio></div>`;
      }

      const displayTime = msgTime || data.time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const metaLabel = type === 'sent' ? initialStatus : `De: ${senderCode}`;
      
      innerHTML += `
        <div class="msg-meta">
          <span>${metaLabel}</span>
          <span style="margin-left:auto; color:var(--text-muted);">${displayTime}</span>
        </div>`;
      
      div.innerHTML = innerHTML;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;

      if (timer > 0 && type === 'received') {
        let countdown = timer;
        const metaDiv = div.querySelector('.msg-meta span');
        const interval = setInterval(() => {
          countdown--;
          metaDiv.innerHTML = `<span style="color:var(--danger)">🔥 Destrucción en ${countdown}s</span>`;
          if (countdown <= 0) {
            clearInterval(interval);
            div.remove();
          }
        }, 1000);
      }
    }

    function updateMessageStatus(msgId, statusText) {
      const el = document.getElementById(msgId);
      if (el) {
        const metaSpan = el.querySelector('.msg-meta span');
        if (metaSpan) metaSpan.textContent = statusText;
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage('text');
      }
    }

    function triggerKillSwitch() {
      masterKey = '';
      chatsData = {};
      approvedChats.clear();
      localStorage.clear();
      document.getElementById('chatMessages').innerHTML = '<div class="message system" style="color:var(--danger)">⚠️ PURGA DE SEGURIDAD EJECUTADA. BOVEDA DESTRUIDA.</div>';
      if (socket) socket.close();
      document.getElementById('chatView').classList.remove('active');
      document.getElementById('homeView').classList.remove('active');
      document.getElementById('authView').classList.add('active');
      showToast('Dispositivo esterilizado');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 2000);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
